name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (analyze, test, build APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android APK (phone-only mode)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kharcha-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  database:
    name: Database schema and security rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run_local.sh

  functions:
    name: Server functions type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/ai-coach/index.ts supabase/functions/delete-account/index.ts

  ios:
    name: iOS build (no signing)
    # macOS runners are free for public repositories. This only checks that
    # the iOS app compiles; signing and TestFlight come later (docs/IOS.md).
    runs-on: macos-latest
    # Informational until the iOS setup in docs/IOS.md is finished.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS app without signing
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://hpbqhrfdwawnlleyazvl.supabase.co' }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_HmnJAMCfPyHJBxQxtRszkw_W_wS3W8n' }}
