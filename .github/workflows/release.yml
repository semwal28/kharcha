name: Release

# Publishes a GitHub Release with both Android APKs whenever the version in
# pubspec.yaml has no release yet. Raise the version, push to main, done.
# Notes come from docs/releases/v<version>.md.
#
# APKs are always signed with the app's permanent key, so each release
# installs as an update. The key lives in these repository secrets (see
# docs/RELEASE.md): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them nothing is released.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          tag="v$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing key secrets are not set, so $tag is not released. See docs/RELEASE.md."
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released."
          elif [ ! -f "docs/releases/$tag.md" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No docs/releases/$tag.md yet, so $tag is not released."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  apk:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://hpbqhrfdwawnlleyazvl.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_HmnJAMCfPyHJBxQxtRszkw_W_wS3W8n' }}
      AI_ENABLED: ${{ vars.AI_ENABLED || 'false' }}
      VERSION: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::A signing key secret is missing. See docs/RELEASE.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter test

      - name: Build phone-only APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/spendwell-${VERSION#v}.apk"
      - name: Build APK with sign-in
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=AI_ENABLED="$AI_ENABLED"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/spendwell-${VERSION#v}-live.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Spendwell ${{ needs.check.outputs.tag }}
          body_path: docs/releases/${{ needs.check.outputs.tag }}.md
          files: dist/*.apk
